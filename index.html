<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Coding Street</title>

<header id="hd"></header>

<!-- شريط صورة البروفايل لكل مستخدم -->
<div style="display:flex; justify-content:flex-end; align-items:center; padding:10px 20px; background:#0d1526; border-bottom:1px solid #1e293b;">
  <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="document.getElementById('avatarInput').click()" title="اضغط لتغيير صورة البروفايل">
    <span style="color:#94a3b8; font-size:0.85rem;">Profile Photo</span>
    <img id="userAvatarImg" src="logo.jpg" alt="Profile" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid #00f2fe;">
    <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadProfilePic(event)">
  </div>
</div>

<main id="app"></main>
<footer>© 2026 Coding Street · Created by <b>Hussein Mahmoud Galal</b></footer>
<div id="kb"><div id="kp"><h4>Coding · Support</h4><div id="km"></div><div style="padding:8px"><input id="ki" placeholder="Ask Coding…" onkeydown="if(event.key=='Enter')kong()"></div></div><button class="btn" onclick="tk()" aria-label="Coding">💬</button></div>
<div id="mo"></div>
<script src="script.js"></script>
